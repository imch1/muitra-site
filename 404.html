<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Muitra</title>
  <meta name="robots" content="noindex" />
  <script>
    (function () {
      var match = window.location.pathname.match(/^\/invite\/([^/?#]+)/);
      if (match) {
        window.location.replace("/invite/?code=" + encodeURIComponent(match[1]));
      } else {
        window.location.replace("/");
      }
    })();
  </script>
</head>
<body>
  <p>Redirecting to Muitra...</p>
</body>
</html>
